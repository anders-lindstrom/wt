name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      # The suite shells out to git and commits, so it needs an identity.
      - name: Configure git
        run: |
          git config --global user.email ci@example.com
          git config --global user.name CI
      - run: go build ./...
      - run: go test ./... -race

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - uses: golangci/golangci-lint-action@v6
        with:
          version: latest

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: Configure git
        run: |
          git config --global user.email ci@example.com
          git config --global user.name CI
      - name: Install bats
        run: sudo apt-get update && sudo apt-get install -y bats
      - run: go build -o bin/wt ./cmd/wt
      - run: bats test/
