name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Verify tagged source
        shell: bash
        run: |
          test "$GITHUB_REF_TYPE" = tag
          test "$(git rev-parse HEAD)" = "$(git rev-parse "$GITHUB_REF^{commit}")"
          test "$(git rev-parse --is-shallow-repository)" = false
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      # Local time, as on the machine make build runs on.
      - run: echo "WT_LDFLAGS=$(scripts/ldflags.sh)" >> "$GITHUB_ENV"
        env:
          TZ: Europe/Stockholm
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: ${{ env.ACT && env.LOCAL_RELEASE_DRY_RUN == 'true' && 'release --clean --snapshot' || 'release --clean' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
