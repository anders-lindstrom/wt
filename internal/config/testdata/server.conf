#!/usr/bin/env bash
# Worktree configuration file
# This file should be customized for each repository

# Repository name - used for worktree directory naming
# If not set, will be auto-detected from the git repository directory name
# REPO_NAME="my-project"

# Whether to run AWS setup (decrypt secrets, verify credentials)
# Set to false for non-AWS projects

# Whether to run tests before removing a worktree
RUN_TESTS_BEFORE_REMOVE=false

# Test command to run (if RUN_TESTS_BEFORE_REMOVE is true)
# Examples: "flutter test", "npm test", "cargo test", "./gradlew test"
TEST_COMMAND="./gradlew test"

# Main/default branch name (used for merge checks)
# Common values: "main", "master", "development"
MAIN_BRANCH="development"

# Developer config directories to copy to new worktrees
# Add or remove directories as needed for your project
DEVELOPER_CONFIG_DIRS=(.cursor .claude .run .vscode .idea)

# Developer config files to copy to new worktrees
# Parent directories will be created automatically if they don't exist
# Add or remove files as needed for your project
DEVELOPER_CONFIG_FILES=(
    "override.properties"
    "accessmanagement/override.properties"
    "common/override.properties"
    "webapp/override.properties"
    "processor/override.properties"
    "listener/override.properties"
)

# Branch prefix for worktree branches created by new.sh
WORKTREE_BRANCH_PREFIX="feat_wt"

# Whether to initialize build system in new worktrees
BUILD_INIT_ENABLED=true

# Build initialization command - customize for your project type
# Examples:
#   Flutter: "flutter pub get && very_good packages get --recursive"
#   Node.js: "npm install" or "yarn install"
#   Rust: "cargo build"
#   Java/Gradle: "./gradlew build -x test --quiet"
BUILD_INIT_COMMAND="./gradlew build -x test --quiet"

# Binaries setup_precheck.sh requires before touching a worktree. Lives here
# rather than in the script so that script can stay identical across repos.
REQUIRED_BINS="aws jq"
