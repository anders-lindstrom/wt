#!/usr/bin/env bash
# Worktree configuration for recipus.
#
# Sourced by bin/worktree_functions.sh::load_worktree_config. Every value here
# has a default in that function; this file only states what recipus differs on.

# REPO_NAME is auto-detected from the main checkout's directory name (recipus),
# which is what worktree paths are built from: ../recipus-<work>.

# recipus has no encrypted secrets and no AWS dependency, so setup skips the
# credential check and the decrypt step entirely.
AWS_SETUP_ENABLED=false

# Removal is a local, reversible operation here; don't spend a test run on it.
RUN_TESTS_BEFORE_REMOVE=false
TEST_COMMAND="pnpm test"

MAIN_BRANCH="master"

# Editor and agent config that is gitignored but that every worktree wants.
# Missing entries are skipped silently, so listing a dir you don't use is free.
DEVELOPER_CONFIG_DIRS=(.claude .vscode .idea)

# Gitignored files a worktree cannot run without. .env carries the local
# Postgres URL and API keys; .env.example is committed and needs no copying.
# Deliberately excluded: .omc and .superpowers hold per-session agent state,
# which should start empty in a new worktree rather than be inherited.
DEVELOPER_CONFIG_FILES=(
    ".env"
)

# Branches created by new.sh are named <type>_wt/<work> — feat_wt/x, fix_wt/x,
# research_wt/x. Pass the type to new.sh as a prefix on the work name
# (`new.sh fix/login-crash`); a bare name takes the default below. The directory
# is always named after the work alone, so the type shows up in git and in PRs
# without changing where anything lives.
#
# WORKTREE_BRANCH_PREFIX still sets the default type — feat_wt means feat.
# Override WORKTREE_TYPES to change the accepted list; it defaults to the
# Conventional Commits types plus research and spike.
WORKTREE_BRANCH_PREFIX="feat_wt"

# Keep every worktree under one parent (../recipus_wt/<work>) instead of a
# sibling directory each (../recipus-<work>). Worktrees that already exist at
# the old layout keep their path, so switching does not orphan them.
WORKTREE_LAYOUT="nested"

# A fresh worktree has no node_modules; install before the first dev run.
BUILD_INIT_ENABLED=true
BUILD_INIT_COMMAND="pnpm install --frozen-lockfile"

# Binaries setup_precheck.sh requires before touching a worktree. Lives here
# rather than in the script so that script can stay identical across repos.
REQUIRED_BINS="pnpm"
