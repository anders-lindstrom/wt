#!/usr/bin/env bash
# Worktree configuration for longhaul.
#
# Sourced by bin/worktree_functions.sh::load_worktree_config. Every value here
# has a default in that function; this file only states what longhaul differs
# on. The scripts themselves are byte-identical across repos on purpose — all
# repo-specific knowledge belongs here.

# REPO_NAME is auto-detected from the main checkout's directory name (longhaul),
# which is what worktree paths are built from: ../longhaul_wt/<work>.

# longhaul has no encrypted secrets and no AWS dependency, so setup skips the
# credential check and the decrypt step entirely.
AWS_SETUP_ENABLED=false

# Removal is local and reversible here (remove.sh keeps unmerged branches by
# renaming them out of the prefix), so don't spend a test run on it.
RUN_TESTS_BEFORE_REMOVE=false
TEST_COMMAND="pnpm test"

MAIN_BRANCH="master"

# Editor and agent config that is gitignored but that every worktree wants.
# Missing entries are skipped silently, so listing a dir you don't use is free.
DEVELOPER_CONFIG_DIRS=(.claude .vscode .idea)

# Gitignored files a worktree cannot run without. .env carries DATABASE_URL,
# STORAGE_DIR and LONGHAUL_DEV_TRUST_ALL; .env.example is committed and needs no
# copying. Deliberately excluded: .omc and .superpowers hold per-session agent
# state, which should start empty in a new worktree rather than be inherited.
#
# NOTE: the copied .env points at the SAME Postgres database and the same
# default dev port as the source worktree. That is fine for reading, and wrong
# the moment two worktrees run `pnpm dev` at once or one of them migrates.
# Before running a second dev server, give the worktree its own of each:
#   docker exec longhaul-pg psql -U longhaul -d postgres \
#       -c 'CREATE DATABASE longhaul_<work> OWNER longhaul'
#   docker exec longhaul-pg pg_dump -U longhaul longhaul \
#       | docker exec -i longhaul-pg psql -U longhaul -d longhaul_<work>
# then point DATABASE_URL at it and start with `pnpm dev -- -p <port>`.
DEVELOPER_CONFIG_FILES=(
    ".env"
)

# Branches created by new.sh are named <prefix>/<work>.
WORKTREE_BRANCH_PREFIX="feat_wt"

# Keep every worktree under one parent (../longhaul_wt/<work>) instead of a
# sibling directory each (../longhaul-<work>). Worktrees that already exist at
# the old flat layout keep their path, so switching does not orphan them —
# ../longhaul-ux-review still resolves.
WORKTREE_LAYOUT="nested"

# A fresh worktree has no node_modules; install before the first dev run.
# --frozen-lockfile so a worktree can never silently drift from pnpm-lock.yaml.
BUILD_INIT_ENABLED=true
BUILD_INIT_COMMAND="pnpm install --frozen-lockfile"

# Binaries setup_precheck.sh requires before touching a worktree. Lives here
# rather than in the script so that script can stay identical across repos.
REQUIRED_BINS="pnpm"
