version: 2

builds:
  - id: wt
    main: ./cmd/wt
    binary: wt
    env: [CGO_ENABLED=0]
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    # The same stamp as make build and install.sh (scripts/ldflags.sh), set by
    # the release workflow, so `wt about` on a release names its commit date.
    ldflags:
      - -s -w {{ .Env.WT_LDFLAGS }}

archives:
  # The shell layers are inside the binary: `wt shell`, `wt shell --compat`.
  - formats: [tar.gz]
    files:
      - README.md

checksum:
  name_template: checksums.txt

changelog:
  use: github
  sort: asc
  filters:
    exclude: ["^docs:", "^test:", "^chore:"]
